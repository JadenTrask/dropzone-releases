<!doctype html><html><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self'; connect-src 'none'"><link rel="stylesheet" href="overlay.css"><title>Dropzone Coaching</title></head><body>
<canvas id="board"></canvas><canvas id="draft"></canvas>
<aside id="toolbar" aria-label="Coaching tools"><div id="grip" title="Drag toolbar" aria-label="Drag toolbar">⠿</div><div id="tools"></div><div class="separator"></div><div id="colors"></div><button id="undo" title="Undo · Ctrl+Z" aria-label="Undo">↶</button><button id="redo" title="Redo · Ctrl+Y" aria-label="Redo">↷</button><button id="clear" title="Clear drawings · Delete" aria-label="Clear drawings">⌫</button><button id="capture" title="Save annotated screenshot · Ctrl+S" aria-label="Save annotated screenshot">▣</button><button id="options" title="Drawing options" aria-label="Drawing options" aria-expanded="false">⚙</button><button id="exit" title="Exit drawing · Esc" aria-label="Exit drawing">×</button></aside>
<section id="settings" hidden><h2>COACH MODE</h2><label>Thickness<input id="thickness" type="range" min="1" max="24"></label><label>Opacity<input id="opacity" type="range" min="10" max="100"></label><label>Custom color<input id="custom" type="color"></label><label>Layer<select id="layer"><option value="temporary">Temporary</option><option value="persistent">Persistent</option></select></label><label>Quick tool<select id="preset"><option value="">Choose a preset</option><option value="rotation">Rotation arrow</option><option value="player">Player circle</option><option value="ball">Ball path</option><option value="pass">Passing lane</option><option value="danger">Danger area</option></select></label><p>Auto-clear affects temporary drawings only. Clear removes both layers.</p></section>
<form id="text-entry" hidden><input maxlength="80" placeholder="BACK POST" aria-label="Annotation text"><button>Place</button></form><div id="notice" role="status"></div><script type="module" src="overlay.js"></script></body></html>
