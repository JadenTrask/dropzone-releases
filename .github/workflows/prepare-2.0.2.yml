name: Prepare reviewed 2.0.2 map assets
on:
  push:
    branches: [codex/wardogs-2.0.2]
    paths: [.github/workflows/prepare-2.0.2.yml, scripts/prepare-wardogs-terrain.py]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prepare-wardogs-2.0.2
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/codex/wardogs-2.0.2'
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Preserve committed file bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          ref: codex/wardogs-2.0.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24.13.0
      - name: Fetch only checksum-pinned map and terrain assets
        run: python scripts/prepare-wardogs-terrain.py
      - name: Verify data integrity and software behavior
        run: npm test
      - name: Commit the reviewed assets to the preparation branch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/assets/wardogs/zestafona app/data/wardogs/terrain app/data/wardogs/maps.json app/data/wardogs/zestafona-assets.json
          $changed = git diff --cached --name-only
          if ($changed) {
            git commit -m 'Bundle checksum-verified WARDOGS assets for 2.0.2'
            git push origin HEAD:codex/wardogs-2.0.2
          }
          git rev-parse HEAD
